name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Fase de Integración Continua (CI)
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Linter y formato con Ruff
        run: ruff check .

      - name: Ejecutar pruebas unitarias
        run: pytest tests/

  # Fase de Despliegue Continuo (CD) - solo al fusionar a main
  deploy:
    needs: lint-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Paso de despliegue simulado
        run: |
          echo "Pruebas pasadas. Iniciando despliegue de agentes en producción..."
          # Aquí añades el comando de despliegue real (ej: docker build, gcloud run deploy, etc.)